name: Sync release to Gitee

# 把 GitHub 最新正式版同步到 Gitee 发行版，供国内不翻墙下载更新。
# - 发版完成后自动触发，任务内持续重试最长 120 分钟（11-07 改，见 .github/scripts/gitee-sync.sh）；
# - 另外每 2 小时兜底检查一次（GitHub 定时器不准，实际常隔 5~9 小时）。
# - 也可以在 Actions 页面手动运行。
on:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gitee-sync
  cancel-in-progress: true   # 新一轮（发了新版）接管，脚本始终传最新版

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Sync
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: aos-promise/eric-toolbox-release
        run: |
          if [ -z "${GITEE_TOKEN}" ]; then echo "没有 GITEE_TOKEN，跳过"; exit 0; fi
          bash .github/scripts/gitee-sync.sh
