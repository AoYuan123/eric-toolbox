name: Fetch law sources
on:
  push:
    branches: [sources]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p out
          UA="Mozilla/5.0 (X11; Linux x86_64) EricToolbox-sources"
          while IFS='|' read -r name url; do
            [ -z "$name" ] && continue
            code=$(curl -sSL --compressed -A "$UA" --max-time 120 -o "out/$name" -w '%{http_code}' "$url" || echo ERR)
            echo "$name $code $(stat -c %s out/$name 2>/dev/null) $url" | tee -a out/_log.txt
          done < .github/sources.txt
          # 审查指南 2023 页面里的附件（PDF/DOC）
          for u in $(grep -o 'href="[^"]*\.\(pdf\|doc\|docx\)[^"]*"' out/cn_guide2023_page.html | cut -d'"' -f2 | sort -u); do
            case "$u" in http*) ;; /*) u="https://www.cnipa.gov.cn$u";; *) u="https://www.cnipa.gov.cn/art/2023/12/21/$u";; esac
            f=guide2023_$(echo "$u" | md5sum | cut -c1-8); curl -sSL -A "$UA" --max-time 300 -o "out/$f" "$u"; echo "$f $(stat -c %s out/$f) $u" | tee -a out/_log.txt
          done
      - name: Save to branch sources-data
        run: |
          rm -f out/*.zip
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan sources-data
          git rm -rq --cached . || true
          git add -f out/
          git commit -qm "sources $(date -u +%F)"
          git push -f origin sources-data
