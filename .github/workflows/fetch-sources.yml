name: Fetch law sources
on:
  push:
    branches: [sources]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p out
          UA="Mozilla/5.0 (X11; Linux x86_64) EricToolbox-sources"
          while IFS='|' read -r name url; do
            [ -z "$name" ] && continue
            code=$(curl -sSL --compressed -A "$UA" --max-time 120 -o "out/$name" -w '%{http_code}' "$url" || echo ERR)
            echo "$name $code $(stat -c %s out/$name 2>/dev/null) $url" | tee -a out/_log.txt
          done < .github/sources.txt
          curl -sSL -A "$UA" https://uscode.house.gov/download.html -o out/uscode_download.html
          z=$(grep -o '[^"]*xml_usc35[^"]*\.zip' out/uscode_download.html | head -1); echo "usc35 zip: $z" | tee -a out/_log.txt
          if [ -n "$z" ]; then case "$z" in http*) u="$z";; /*) u="https://uscode.house.gov$z";; *) u="https://uscode.house.gov/$z";; esac; curl -sSL -A "$UA" "$u" -o out/usc35.zip; (cd out && unzip -o -q usc35.zip && rm usc35.zip); fi
          ls -la out >> out/_log.txt
      - name: Save to branch sources-data
        run: |
          rm -f out/*.zip
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan sources-data
          git rm -rq --cached . || true
          git add -f out/
          git commit -qm "sources $(date -u +%F)"
          git push -f origin sources-data
