name: Fetch law sources
on:
  push:
    branches: [sources]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p out
          UA="Mozilla/5.0 (X11; Linux x86_64) EricToolbox-sources"
          while IFS='|' read -r name url; do
            [ -z "$name" ] && continue
            code=$(curl -sSL -A "$UA" --max-time 120 -o "out/$name" -w '%{http_code}' "$url" || echo ERR)
            echo "$name $code $(stat -c %s out/$name 2>/dev/null) $url" | tee -a out/_log.txt
          done < .github/sources.txt
          # WIPO 页面里的 PDF 链接
          for u in $(grep -o 'https://[^"]*lexdocs[^"]*\.pdf' out/wipo_21027.html | sort -u); do f=wipo_$(basename $u); curl -sSL -A "$UA" --max-time 120 -o "out/$f" "$u"; echo "$f $(stat -c %s out/$f) $u" | tee -a out/_log.txt; done
          for u in $(grep -o '/wipolex/[a-z]*/text/[0-9]*' out/wipo_21027.html | sort -u); do echo "wipo text link $u" | tee -a out/_log.txt; done
          # 美国法典第 35 编：下载页里的 XML 包
          z=$(grep -o '[^"]*xml_usc35[^"]*\.zip' out/uscode_download.html | head -1); echo "usc35 zip: $z" | tee -a out/_log.txt
          if [ -n "$z" ]; then case "$z" in http*) u="$z";; /*) u="https://uscode.house.gov$z";; *) u="https://uscode.house.gov/$z";; esac; curl -sSL -A "$UA" "$u" -o out/usc35.zip; (cd out && unzip -o -q usc35.zip; ls -la | tee -a _log.txt); fi
          grep -o 'href="[^"]*"' out/uscode_download.html | head -60 >> out/_log.txt
          # 药品专利链接附件
          for u in $(grep -o 'href="[^"]*\.doc[x]*"' out/cn_linkage_gov.html | cut -d'"' -f2); do case "$u" in http*) ;; *) u="https://www.gov.cn/zhengce/zhengceku/2021-07/04/$u";; esac; f=linkage_$(basename $u); curl -sSL -A "$UA" -o "out/$f" "$u"; echo "$f $(stat -c %s out/$f) $u" | tee -a out/_log.txt; done
      - name: Save to branch sources-data
        run: |
          rm -f out/*.zip
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan sources-data
          git rm -rq --cached . || true
          git add -f out/
          git commit -qm "sources $(date -u +%F)"
          git push -f origin sources-data
