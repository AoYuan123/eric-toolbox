name: Fetch law sources
on:
  push:
    branches: [sources]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p out
          UA="Mozilla/5.0 (X11; Linux x86_64) EricToolbox-sources"
          while IFS='|' read -r name url; do
            [ -z "$name" ] && continue
            code=$(curl -sSL --compressed -A "$UA" --max-time 120 -o "out/$name" -w '%{http_code}' "$url" || echo ERR)
            echo "$name $code $(stat -c %s out/$name 2>/dev/null) $url" | tee -a out/_log.txt
          done < .github/sources.txt
          # govinfo 检索 CAFC 判决（DEMO_KEY 公共测试密钥）
          for q in '"Juno Therapeutics" "Kite Pharma"' '"Ariad Pharmaceuticals" "Eli Lilly"'; do
            n=$(echo "$q" | tr -cd 'A-Za-z' | cut -c1-12)
            curl -sS -X POST -H 'Content-Type: application/json' --max-time 60 "https://api.govinfo.gov/search?api_key=DEMO_KEY" \
              -d "{\"query\":\"collection:USCOURTS courtcode:cafc $q\",\"pageSize\":10,\"offsetMark\":\"*\"}" -o "out/gi_$n.json"; echo "gi_$n $(stat -c %s out/gi_$n.json)" | tee -a out/_log.txt
          done
      - name: Save to branch sources-data
        run: |
          rm -f out/*.zip
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan sources-data
          git rm -rq --cached . || true
          git add -f out/
          git commit -qm "sources $(date -u +%F)"
          git push -f origin sources-data
